{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Hostel Desk{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <script src="{% static 'js/app.js' %}" defer></script>
</head>
<body style="margin: 0; padding: 0; background-color: #0b1329; color: #f8fafc; font-family: 'DM Sans', sans-serif;">
    <div class="app-shell" style="display: flex; min-height: 100vh; width: 100vw; overflow-x: hidden;">
        
        <!-- Left Sidebar Navigation -->
        <aside class="sidebar" id="sidebar" style="width: 250px; min-width: 250px; background-color: #0d1730; border-right: 1px solid #1e293b; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; position: fixed; height: 100vh; top: 0; left: 0; z-index: 100;">
            <div>
                <div class="sidebar-header" style="margin-bottom: 25px;">
                    <a href="{% url 'reports:index' %}" class="brand-link" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff;">
                        <span class="brand-symbol" style="background: #00b4d8; color: white; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-weight: bold; font-size: 16px;">H</span>
                        <span class="brand-name" style="font-weight: 700; font-size: 18px; font-family: 'Manrope', sans-serif;">hosteldesk</span>
                    </a>
                </div>
                
                <p class="nav-caption" style="font-size: 11px; font-weight: 700; color: #475569; letter-spacing: 1px; margin-bottom: 12px;">WORKSPACE</p>
                
                <nav class="primary-nav" style="display: flex; flex-direction: column; gap: 4px;">
                    <a class="nav-link" href="{% url 'reports:index' %}" style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; text-decoration: none; color: #94a3b8; border-radius: 6px; font-size: 14px;">
                        <span style="font-weight: bold; width: 15px;">D</span>
                        <span>Dashboard</span>
                    </a>
                    <a class="nav-link" href="{% url 'rooms:room_list' %}" style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; text-decoration: none; color: #94a3b8; border-radius: 6px; font-size: 14px;">
                        <span style="font-weight: bold; width: 15px;">R</span>
                        <span>Rooms</span>
                    </a>
                    <a class="nav-link" href="{% url 'residents:resident_list' %}" style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; text-decoration: none; color: #94a3b8; border-radius: 6px; font-size: 14px;">
                        <span style="font-weight: bold; width: 15px;">P</span>
                        <span>Residents</span>
                    </a>
                    <a class="nav-link" href="{% url 'billing:charge_list' %}" style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; text-decoration: none; color: #94a3b8; border-radius: 6px; font-size: 14px;">
                        <span style="font-weight: bold; width: 15px;">B</span>
                        <span>Billing</span>
                    </a>
                    <a class="nav-link" href="{% url 'reports:index' %}" style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; text-decoration: none; color: #94a3b8; border-radius: 6px; font-size: 14px;">
                        <span style="font-weight: bold; width: 15px;">T</span>
                        <span>Reports</span>
                    </a>
                    <a class="nav-link" href="#" style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; text-decoration: none; color: #94a3b8; border-radius: 6px; font-size: 14px;">
                        <span style="font-weight: bold; width: 15px;">S</span>
                        <span>Settings</span>
                    </a>
                    <a class="nav-link" href="#" style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; text-decoration: none; color: #94a3b8; border-radius: 6px; font-size: 14px;">
                        <span style="font-weight: bold; width: 15px;">L</span>
                        <span>Audit log</span>
                    </a>
                    <a class="nav-link" href="{% url 'admin:index' %}" style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; text-decoration: none; color: #94a3b8; border-radius: 6px; font-size: 14px;">
                        <span style="font-weight: bold; width: 15px;">A</span>
                        <span>Administration</span>
                    </a>
                </nav>
            </div>

            <div class="sidebar-footer" style="border-top: 1px solid #1e293b; padding-top: 15px;">
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 12px; color: #10b981;">
                    <span style="height: 8px; width: 8px; background: #10b981; border-radius: 50%; display: inline-block;"></span>
                    <span>Workspace ready</span>
                </div>
                <div class="user-card" style="display: flex; align-items: center; gap: 10px;">
                    <span class="user-avatar" style="background: #1e293b; color: #38bdf8; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px;">R</span>
                    <span class="user-name" style="font-weight: 600; font-size: 13px; color: #cbd5e1;">RK</span>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="workspace-main" style="margin-left: 250px; width: calc(100% - 250px); min-height: 100vh; box-sizing: border-box; background-color: #0b1329;">
            <main class="content-area" style="padding: 30px; box-sizing: border-box; width: 100%;">
                {% block content %}
                {% endblock %}
            </main>
        </div>
    </div>
</body>
</html>
